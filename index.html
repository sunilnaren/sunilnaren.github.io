<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunil Narendrababu</title>
<meta name="description" content="Projects by Sunil Narendrababu.">
<style>
:root {
  --bg: #ffffff;
  --fg: #1c1c1e;
  --muted: #6b6b70;
  --rule: #e3e3e6;
  --accent: #0a68d8;
  --panel: #f7f7f9;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131315;
    --fg: #f2f2f4;
    --muted: #a1a1a8;
    --rule: #2e2e32;
    --accent: #5fa8ff;
    --panel: #1d1d20;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 0 16px;
  background: var(--bg);
  color: var(--fg);
  font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 44rem; margin: 0 auto; padding: 56px 0 96px; }
header { border-bottom: 1px solid var(--rule); padding-bottom: 24px; margin-bottom: 32px; }
h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 8px; letter-spacing: -0.02em; }
h2 { font-size: 1.2rem; margin: 40px 0 10px; letter-spacing: -0.01em; }
h3 { font-size: 1rem; margin: 28px 0 6px; }
p, li { color: var(--fg); }
.lede, .muted { color: var(--muted); }
.lede { font-size: 1.05rem; margin: 0; }
a { color: var(--accent); }
nav { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 20px; }
nav a { text-decoration: none; font-weight: 600; }
nav a:hover { text-decoration: underline; }
.panel {
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: 10px;
  padding: 18px 20px;
  margin: 24px 0;
}
.panel p:first-child { margin-top: 0; }
.panel p:last-child { margin-bottom: 0; }
ul { padding-left: 1.25rem; }
li { margin: 6px 0; }
footer {
  margin-top: 64px;
  padding-top: 24px;
  border-top: 1px solid var(--rule);
  color: var(--muted);
  font-size: 0.9rem;
}
code { background: var(--panel); padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Sunil Narendrababu</h1>
  <p class="lede">Projects.</p>
</header>

<h2>ErgoSafe</h2>
<p>Ergonomic risk assessment for iPhone and iPad. Scores workplace posture
against RULA from a short video, entirely on device.</p>

  <a href="/ergosafe/">Overview</a>
  <a href="/ergosafe/support.html">Support</a>
  <a href="/ergosafe/privacy-policy.html">Privacy Policy</a>
</nav>

<footer>
  <p>Contact: <a href="mailto:narensunil03@gmail.com">narensunil03@gmail.com</a></p>
</footer>
</div>
</body>
</html>
